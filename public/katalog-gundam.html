<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torch x Mobile Suit Gundam – Katalog Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;1,800;1,900&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
@page{size:A4 landscape;margin:0}
:root{--ink:#10131a;--paper:#eeece6;--red:#d71920;--blue:#1f5fbf;--yellow:#f2b705;--navy:#0c1630;
  --disp:'Barlow Condensed','Arial Narrow','Impact',sans-serif;--mono:'Chakra Petch','Menlo','Consolas',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#3a3d44;font-family:var(--mono);color:var(--ink)}
.toolbar{position:sticky;top:0;z-index:50;background:#0c1630;color:#fff;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px}
.toolbar b{font-family:var(--disp);font-style:italic;font-size:18px;letter-spacing:.5px}
.toolbar button{background:var(--yellow);color:#111;border:0;padding:7px 14px;font:700 13px var(--mono);cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.toolbar span{opacity:.8}
.wrap{display:flex;flex-direction:column;align-items:center;gap:0;padding:18px 0 60px}
.page{position:relative;width:297mm;height:210mm;background:var(--paper);overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.45);page-break-after:always;break-after:page}
.picker{width:297mm;background:#1b1e26;padding:8px 10px 12px;margin-bottom:26px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.picker small{color:#9aa3b5;font-size:11px;width:100%}
.picker img{height:54px;width:54px;object-fit:cover;cursor:pointer;border:2px solid transparent;opacity:.75}
.picker img:hover{opacity:1}.picker img.pk-hero{border-color:var(--yellow);opacity:1}.picker img.pk-sup{border-color:#4fd1c5;opacity:1}
@media print{
  body{background:none}.toolbar,.picker small{display:none!important}.wrap{padding:0}
  .page{box-shadow:none}
}
/* ---------- shared decor ---------- */
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(16,19,26,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(16,19,26,.05) 1px,transparent 1px);background-size:8mm 8mm}
.dots{position:absolute;width:46mm;height:34mm;background-image:radial-gradient(var(--ink) 1.1px,transparent 1.3px);background-size:2.6mm 2.6mm;opacity:.25}
.bar{position:absolute;left:0;right:0;bottom:0;height:11mm;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:12mm;font:italic 800 11px var(--disp);letter-spacing:1.5px;text-transform:uppercase}
.bar::before{content:"";position:absolute;left:12mm;top:0;bottom:0;width:34mm;background:repeating-linear-gradient(-60deg,#fff 0 1.6mm,transparent 1.6mm 3.2mm);opacity:.9;clip-path:polygon(0 0,100% 0,calc(100% - 6mm) 100%,0 100%)}
.bar .brand{position:absolute;left:52mm;font:700 10px var(--mono);letter-spacing:2px;opacity:.8}
.hazard{position:absolute;height:3.2mm;background:repeating-linear-gradient(-45deg,var(--yellow) 0 2.4mm,var(--ink) 2.4mm 4.8mm)}
.corner{position:absolute;width:9mm;height:9mm;border:0 solid var(--ink)}
/* ---------- cover ---------- */
.cover{background:var(--navy);color:#fff}
.cover .split{position:absolute;inset:0;background:linear-gradient(115deg,var(--blue) 0 46%,transparent 46%),linear-gradient(115deg,transparent 0 58%,var(--red) 58%);opacity:.95}
.cover .mid{position:absolute;inset:0;background:linear-gradient(115deg,transparent 0 46%,#f4f4f0 46% 58%,transparent 58%)}
.cover .grid{background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px)}
.cover .lock{position:absolute;left:16mm;top:14mm;font:700 13px var(--mono);letter-spacing:4px}
.cover h1{position:absolute;left:14mm;top:52mm;font:italic 900 46mm/0.82 var(--disp);text-transform:uppercase;color:#fff;text-shadow:3mm 3mm 0 rgba(0,0,0,.35)}
.cover h1 span{display:block;color:var(--yellow)}
.cover .sub{position:absolute;left:16mm;bottom:30mm;font:600 13px var(--mono);letter-spacing:5px}
.cover .tag{position:absolute;right:16mm;bottom:30mm;text-align:right;font:italic 800 22px var(--disp);letter-spacing:2px;text-transform:uppercase}
.cover .tag small{display:block;font:500 11px var(--mono);letter-spacing:3px;opacity:.85;margin-top:2mm}
.cover .bar{background:#000}
/* ---------- contents ---------- */
.toc h2{position:absolute;left:14mm;top:10mm;font:italic 900 24mm/0.9 var(--disp);text-transform:uppercase}
.toc h2::after{content:attr(data-t);position:absolute;left:1.6mm;top:1.6mm;color:transparent;-webkit-text-stroke:1px var(--ink);z-index:-1}
.toc .cols{position:absolute;left:14mm;right:14mm;top:38mm;bottom:16mm;display:grid;grid-template-columns:repeat(4,1fr);gap:0 7mm;align-content:start}
.toc .sec{font:italic 800 13px var(--disp);letter-spacing:1.5px;text-transform:uppercase;border-bottom:2px solid var(--ink);margin:0 0 2mm;padding:1mm 0;color:#fff;background:var(--ink);padding-left:2mm}
.toc .col{display:flex;flex-direction:column;gap:0}
.toc .it{display:flex;gap:2mm;font:600 9.5px var(--mono);padding:1.05mm 0;border-bottom:1px dashed rgba(16,19,26,.3)}
.toc .it i{font-style:normal;color:var(--red);width:6mm;font-weight:700}
.toc .it em{margin-left:auto;font-style:normal;opacity:.7}
.toc .col+.col{}
.toc .gap{height:4mm}
/* ---------- product ---------- */
.prod{--a:#f2b705}
.prod .slab{position:absolute;left:0;top:0;width:180mm;height:199mm;background:var(--a);clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
.prod .hero{position:absolute;left:0;top:0;width:170mm;height:199mm;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);background:#0c1630}
.prod .hero img{width:100%;height:100%;object-fit:cover;display:block}
.prod .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.0) 60%,rgba(0,0,0,.28))}
.prod .num{position:absolute;left:8mm;top:6mm;font:italic 900 30mm/0.8 var(--disp);color:transparent;-webkit-text-stroke:1.2px #fff;z-index:3;opacity:.95;text-shadow:0 0 0 #fff}
.prod .badge{position:absolute;left:9mm;top:36mm;background:var(--a);color:#fff;font:700 10px var(--mono);letter-spacing:2.5px;padding:1.2mm 3mm 1.2mm 3mm;z-index:3;clip-path:polygon(0 0,100% 0,calc(100% - 3mm) 100%,0 100%)}
.prod .badge.yel{color:#111}
.prod .sup{position:absolute;bottom:18mm;display:flex;gap:3mm;left:9mm;z-index:4}
.prod .sup div{width:38mm;height:38mm;border:1.2mm solid #fff;background:#222;box-shadow:0 2px 8px rgba(0,0,0,.4);overflow:hidden}
.prod .sup img{width:100%;height:100%;object-fit:cover}
.prod .bracket{position:absolute;z-index:3;width:8mm;height:8mm;border:0 solid #fff}
.prod .info{position:absolute;left:186mm;right:11mm;top:12mm;bottom:17mm;display:flex;flex-direction:column;gap:4mm}
.prod .type{font:700 10px var(--mono);letter-spacing:4px;text-transform:uppercase;color:var(--a);display:flex;gap:2mm;align-items:center}
.prod .type::before{content:"";width:6mm;height:2.4mm;background:var(--a)}
.prod .type.yel{color:#a47c00}.prod .type.yel::before{background:var(--yellow)}
.prod h2{position:relative;font:italic 900 14mm/0.9 var(--disp);text-transform:uppercase;letter-spacing:-.3px;z-index:1;word-break:break-word}
.prod h2::after{content:attr(data-t);position:absolute;left:0;top:0;transform:translate(1.4mm,1.4mm);color:transparent;-webkit-text-stroke:1px var(--ink);z-index:-1;opacity:.55}
.prod .price{position:relative;align-self:flex-start;background:var(--ink);color:#fff;padding:2.6mm 9mm 2.6mm 4mm;clip-path:polygon(0 0,100% 0,calc(100% - 6mm) 100%,0 100%);display:flex;align-items:baseline;gap:3mm}
.prod .price b{font:italic 900 9mm/1 var(--disp);letter-spacing:.5px}
.prod .price s{font:600 11px var(--mono);opacity:.6}
.prod .price u{text-decoration:none;font:700 10px var(--mono);background:var(--yellow);color:#111;padding:.6mm 1.6mm}
.prod .lbl{font:700 9.5px var(--mono);letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;gap:2mm;margin-bottom:2mm}
.prod .lbl::before{content:"";width:2.6mm;height:2.6mm;background:var(--a)}
.prod .lbl.yel::before{background:var(--yellow)}
.prod .lbl::after{content:"";flex:1;height:1px;background:rgba(16,19,26,.35)}
.prod .cols{display:grid;grid-template-columns:repeat(2,1fr);gap:2.4mm}
.prod .col{display:flex;align-items:center;gap:2.4mm;background:#fff;border:1px solid rgba(16,19,26,.25);padding:1.6mm;font:600 10px/1.15 var(--mono)}
.prod .col .sw{flex:none;width:11mm;height:11mm;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.prod .col .ph{flex:none;width:11mm;height:11mm;object-fit:cover;border-radius:50%;border:1px solid rgba(0,0,0,.35)}
.prod .sizes{display:flex;gap:2mm;flex-wrap:wrap}
.prod .sz{min-width:11mm;height:9mm;padding:0 2.4mm;border:1.4px solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 12px var(--mono);background:#fff}
.prod .fs{display:flex;gap:3mm}
.prod .fs div{flex:1;max-width:36mm;aspect-ratio:3/4;background:#fff;border:1mm solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.3);overflow:hidden}
.prod .fs img{width:100%;height:100%;object-fit:cover;display:block}
.prod .stk{display:flex;flex-direction:column;gap:1.4mm}
.prod .stk div{display:flex;align-items:center;gap:2.4mm;font:600 10px var(--mono);background:var(--ink);color:#fff;padding:1.5mm 3mm;clip-path:polygon(0 0,100% 0,calc(100% - 3mm) 100%,0 100%)}
.prod .stk div i{font-style:normal;color:var(--yellow);font-weight:700}
.prod .note{font:600 10px/1.4 var(--mono);background:#fff;border-left:2mm solid var(--yellow);padding:2mm 3mm}
.prod .soldout{position:absolute;right:11mm;top:8mm;background:#444;color:#fff;font:700 11px var(--mono);letter-spacing:3px;padding:1.4mm 4mm;transform:rotate(0)}
.prod .url{margin-top:auto;font:500 8.5px var(--mono);opacity:.6;letter-spacing:.6px}

/* ---------- tampilan mobile (layar saja; cetak tetap A4) ---------- */
@media screen and (max-width:900px){
  .toolbar{position:static;padding:8px 12px;gap:8px;font-size:11px}
  .toolbar b{font-size:15px;width:100%}
  .toolbar span{display:none}
  .toolbar label{display:flex;align-items:center;gap:4px}
  .wrap{padding:0 0 40px}
  .page{width:100%;height:auto;box-shadow:none}
  .picker{width:100%;margin-bottom:0;border-bottom:6px solid #3a3d44}
  .picker img{height:48px;width:48px}
  .bar{position:relative;height:11mm}
  .bar::before{left:4vw}.bar .brand{left:34vw;font-size:9px}
  .bar{padding-right:4vw}
  /* cover & penutup */
  .cover{height:150vw}
  .cover .lock{left:6vw;top:10vw;font-size:3vw!important;letter-spacing:.8vw!important}
  .cover h1{left:5vw;top:24vw;font-size:27vw!important}
  .cover .sub{left:6vw;bottom:46vw;font-size:3vw;letter-spacing:1vw}
  .cover .tag{left:6vw;right:auto;bottom:20vw;text-align:left;font-size:5.4vw}
  .cover .tag small{font-size:2.6vw}
  .cover .bar{position:absolute}
  /* daftar isi */
  .toc{height:auto;padding:6vw 5vw 14mm}
  .toc h2{position:relative;left:0;top:0;font-size:17vw}
  .toc .cols{position:static;grid-template-columns:1fr;margin-top:5vw}
  .toc .dots{display:none}
  .toc .it{font-size:12px;padding:1.6mm 0}
  /* halaman produk */
  .prod{display:flex;flex-direction:column}
  .prod .slab{display:none}
  .prod .grid{position:absolute}
  .prod .hero{position:relative;width:100%;height:96vw;clip-path:none}
  .prod .hero::after{display:none}
  .prod .num{left:4vw;top:3vw;font-size:20vw}
  .prod .badge{left:5vw;top:24vw}
  .prod .sup{left:4vw;top:68vw;bottom:auto}
  .prod .sup div{width:24vw;height:24vw;border-width:.8vw}
  .prod .info{position:relative;left:auto;right:auto;top:auto;bottom:auto;padding:5vw;gap:4vw}
  .prod h2{font-size:11.5vw!important}
  .prod .price b{font-size:11vw}
  .prod .col{font-size:12px}
  .prod .col .sw,.prod .col .ph{width:12mm;height:12mm}
  .prod .fs div{max-width:none}
  .prod .stk div,.prod .note{font-size:12px}
  .prod .dots,.prod .url{display:none}
  .prod .soldout{top:3vw;right:4vw}
  .prod .hero[style]+.num{display:none}
  .prod .hero[style]{padding:6vw!important;height:auto!important;aspect-ratio:auto}
}
/* HP: satu produk (halaman + pemilih foto) muat satu layar — foto, nama, harga, warna, stiker, pilihan foto */
@media screen and (max-width:900px){
  .prod .hero{height:56vw}
  .prod .num{left:3vw;top:1.5vw;font-size:14vw}
  .prod .badge{left:4vw;top:15.5vw;font-size:9px;padding:.8vw 2.4vw;letter-spacing:2px}
  .prod .sup{left:3vw;top:38.5vw;bottom:auto}
  .prod .sup div{width:15vw;height:15vw;border-width:.6vw}
  .prod .soldout{top:2vw;right:3vw;font-size:10px;padding:1vw 3vw}
  .prod .info{padding:3vw 4vw 2.5vw;gap:2vw}
  .prod .type{font-size:9px;letter-spacing:3px}
  .prod h2{font-size:7.4vw!important}
  .prod .price{padding:1.2vw 6vw 1.2vw 3vw}
  .prod .price b{font-size:7vw}
  .prod .lbl{font-size:8.5px;margin-bottom:1vw;letter-spacing:2px}
  .prod .cols{gap:1.4vw}
  .prod .col{padding:.8vw;gap:1.6vw;font-size:11px}
  .prod .col .sw,.prod .col .ph{width:7.5vw;height:7.5vw}
  .prod .sizes{gap:1.4vw}
  .prod .sz{height:7vw;min-width:8vw;font-size:11px}
  .prod .fs{gap:2vw}
  .prod .fs div{max-width:19vw;border-width:.6vw}
  .prod .note{display:none}
  .bar{height:8mm}
  .picker{padding:5px 8px 6px;gap:4px}
  .picker small{font-size:9.5px;line-height:1.2}
  .picker img{height:32px;width:32px}
}
/* find-us v2 */
.find{background:var(--navy);color:#fff}
.find .ft{position:absolute;left:14mm;top:10mm;font:italic 900 24mm/.9 var(--disp);text-transform:uppercase;margin:0}
.find .fs2{position:absolute;left:16mm;top:37mm;font:600 12px var(--mono);letter-spacing:5px;text-transform:uppercase;opacity:.85}
.find .stores{position:absolute;left:14mm;right:14mm;top:54mm;bottom:19mm;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6mm 7mm}
.find .st{background:rgba(255,255,255,.08);border-left:1.8mm solid var(--yellow);padding:4mm 5mm;display:flex;flex-direction:column;justify-content:center;gap:2mm}
.find .st b{font:italic 800 17px var(--disp);letter-spacing:1px;text-transform:uppercase}
.find .st span{font:500 11px/1.45 var(--mono);opacity:.9}
@media screen and (max-width:900px){
  .find{height:auto;padding:6vw 5vw 16mm}
  .find .ft,.find .fs2,.find .stores{position:relative;left:0;right:0;top:0;bottom:0}
  .find .ft{font-size:16vw;display:block}
  .find .fs2{margin:1vw 0 4vw}
  .find .stores{grid-template-columns:1fr;grid-template-rows:none;gap:2.4vw}
  .find .st{padding:3.2vw 4vw}
  .find .st span{font-size:11px}
}
/* v3: size chart, pemilih foto di dalam halaman, nama tanpa bayangan, halaman QR */
.prod h2::after{display:none}
.prod .szt{width:100%;border-collapse:collapse;background:#fff;font:600 10px var(--mono)}
.prod .szt th{background:var(--ink);color:#fff;font:700 9px var(--mono);letter-spacing:1.5px;text-transform:uppercase;padding:1.4mm 2mm;text-align:center}
.prod .szt td{padding:1.1mm 2mm;text-align:center;border-bottom:1px solid rgba(16,19,26,.18)}
.prod .szt tr:last-child td{border-bottom:0}
.prod .hatsz{background:#fff;border-left:2mm solid var(--yellow);padding:2mm 3mm;font:600 10px/1.4 var(--mono)}
.prod .szn{font:500 8.5px var(--mono);opacity:.7;margin-top:1.2mm}
.prod .info > *{flex:none}
.prod .info > .picker{flex:1 1 0;min-height:0;display:flex;flex-direction:column;flex-wrap:nowrap;align-items:stretch;width:auto;background:transparent;padding:0;margin:0;border:0;gap:1mm}
.prod .info .picker small{color:#5b6270;font:600 9px var(--mono);letter-spacing:.4px;width:auto}
.prod .pg{flex:1 1 auto;min-height:0;width:100%;max-width:100%;overflow:hidden;display:grid;grid-template-columns:repeat(var(--mc,3),1fr);gap:5px;justify-content:center;align-content:center}
.prod .pg img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border:2px solid transparent;opacity:1;cursor:pointer;background:#ddd}
.prod .pg img.pk-hero{border-color:var(--yellow)}
.prod .pg img.pk-sup{border-color:#4fd1c5}
@media print{.prod .pg img{border-color:transparent!important}}
.cover .mid{background:linear-gradient(115deg,transparent 0 46%,rgba(8,14,32,.62) 46% 58%,transparent 58%)}
.cover .lockup{position:absolute;left:50%;top:56mm;width:166mm;height:auto;transform:translateX(-50%);filter:drop-shadow(0 1.2mm 3mm rgba(0,0,0,.35))}
.cover .legal{position:absolute;left:50%;transform:translateX(-50%);bottom:14mm;width:130mm;text-align:center;font:500 8.5px/1.55 var(--mono);color:#fff;opacity:.95;letter-spacing:.2px}
.qrp{background:var(--navy);color:#fff}
.qrp .ft{position:absolute;left:14mm;top:12mm;font:italic 900 22mm/.9 var(--disp);text-transform:uppercase;margin:0}
.qrp .fs2{position:absolute;left:16mm;top:37mm;font:600 12px var(--mono);letter-spacing:5px;text-transform:uppercase;opacity:.85}
.qrp .qbox{position:absolute;left:0;right:0;top:48mm;bottom:17mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5mm;text-align:center}
.qrp .q{display:block;background:#fff;padding:3mm;width:70mm;height:70mm;border-radius:2mm;border-bottom:1.6mm solid var(--yellow)}
.qrp .scan{font:700 12px var(--mono);letter-spacing:4px;text-transform:uppercase}
.qrp .wa{font:italic 800 22px var(--disp);letter-spacing:1px}
.qrp .msg{font:500 11px/1.5 var(--mono);opacity:.88;max-width:130mm}
@media screen and (max-width:900px){
  .prod .info > .picker{flex:none}
  .prod .pg{align-content:start;gap:1.6vw}
  .cover .lockup{top:36vw;width:88vw}
  .cover .legal{bottom:13vw;width:92vw;font-size:2.6vw}
  .cover .tag{bottom:32vw}
  .cover .sub{bottom:58vw}
  .cover{height:150vw}
  .cover .mid{display:none}
  .cover .split{background:linear-gradient(168deg,var(--blue) 0 66%,var(--red) 66%)}
  .cover .tag,.cover .sub,.cover .legal{text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .qrp{height:auto;padding:6vw 5vw 16mm}
  .qrp .ft,.qrp .fs2,.qrp .qbox{position:relative;left:0;right:0;top:0;bottom:0}
  .qrp .ft{font-size:16vw;display:block}
  .qrp .fs2{margin:1vw 0 5vw}
  .qrp .q{width:62vw;height:62vw}
  .qrp .qbox{gap:3vw}
}
</style>
</head>
<body>
<div class="toolbar">
  <b>TORCH × MOBILE SUIT GUNDAM · KATALOG</b>
  <button onclick="window.print()">Cetak / Simpan PDF</button>
  <button onclick="resetPick()" style="background:#fff">Reset pilihan foto</button>
  <label><input type="checkbox" id="supMode"> Mode foto pendukung</label>
  <span>Klik/tap foto di bawah tiap halaman = foto utama · Shift+klik atau centang "Mode foto pendukung" = foto pendukung (maks 2). Pilihan tersimpan otomatis.</span>
</div>

function product(p){
  const st = state(p), acc = ACC[p.faction];
  const hero = p.images[st.hero];
  const yel = p.faction==="neu";
  const size = p.name.length<=17?15:p.name.length<=24?12.5:10.8;
  const badge = p.faction==="zeon"?"ZEON":p.faction==="fed"?"FEDERATION":"";
  const colors = p.colors.length ? `<div><div class="lbl ${yel?"yel":""}">Pilihan Warna · ${p.colors.length}</div><div class="cols">`+

  const sizes = p.sizes.length ? `<div><div class="lbl ${yel?"yel":""}">Ukuran</div><div class="sizes">`+p.sizes.map(s=>`<span class="sz">${esc(s.name)}</span>`).join("")+`</div></div>` : "";
  const ck = Object.keys(SIZECHARTS).find(k=>p.slug.startsWith(k));
  const ch = ck ? SIZECHARTS[ck] : null;
  // hanya ukuran yang dijual (2XL = XXL); tanpa data ukuran → semua baris
  const avail = p.sizes.map(x=>String(x.name).toUpperCase().replace("2XL","XXL"));
  const rows = ch ? ch.rows.filter(r=>!avail.length||avail.includes(r[0])) : [];
  const chart = ch ? `<div><div class="lbl ${yel?"yel":""}">Size Chart${ch.label?" · "+ch.label:""} (cm)</div><table class="szt"><thead><tr><th>Size</th><th>Panjang</th><th>Lebar</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table><div class="szn">Toleransi ukuran ±1–2 cm</div></div>` : "";
  // Topi: ukuran tunggal (lingkar kepala dari halaman Dimensi torch.id)
  const hat = ["regis","aegis","lumine"].some(k=>p.slug.startsWith(k)) ? `<div><div class="lbl ${yel?"yel":""}">Ukuran</div><div class="hatsz">Lingkar kepala 50–60 cm (adjustable)</div></div>` : "";

      ${colors}${ch?"":sizes}${chart}${hat}${picker(p)}

    <div class="dots" style="right:12mm;bottom:14mm;width:30mm;height:22mm"></div>

  </section>`;
}
function picker(p){
  const st = state(p), n = p.images.length, mc = n<=1?1:(n===2||n===4)?2:3;
  return `<div class="picker" data-slug="${p.slug}"><small>klik = foto utama · Shift+klik = foto pendukung</small><div class="pg" style="--mc:${mc}">`+

function fitGalleries(){
  const mob = matchMedia("(max-width:900px)").matches;
  document.querySelectorAll(".prod .pg").forEach(pg=>{
    pg.style.gridTemplateColumns = "";
    const n = pg.children.length; if(mob || !n) return;
    const pk = pg.parentElement, pr = pk.getBoundingClientRect(), r = pg.getBoundingClientRect(), z = (pr.width/pk.offsetWidth)||1, g = 5;
    const W = pk.clientWidth, H = r.height/z; if(!(W>0&&H>0)) return;   // tab tersembunyi: biarkan CSS bawaan
    let best = 0, bc = 1;
    for(let c=1;c<=n;c++){ const rows=Math.ceil(n/c), sz=Math.min((W-(c-1)*g)/c,(H-(rows-1)*g)/rows); if(sz>best){ best=sz; bc=c; } }

  });
}
