const IMGW = (u,w)=>u + (u.includes("?")?"&":"?") + "width=" + w;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
const ACC = {zeon:"#d71920", fed:"#1f5fbf", neu:"#f2b705"};
const GROUPS = [["BACKPACK","SLING BAG","WAIST BAG"],["TOTEBAG & POUCH"],["APPAREL"],["ACCESSORIES"]];
const TYPE_ORDER = ["Backpack","Sling Bag","Waist Bag","Foldable Totebag","Pouch","T-Shirt","Baseball Hat","Neck Wallet","Tumbler","Enamel Pin","Patch"];
let pick = {};
try{ pick = JSON.parse(localStorage.getItem("torch_gundam_pick")||"{}"); }catch(e){}
const save = ()=>{ try{localStorage.setItem("torch_gundam_pick",JSON.stringify(pick));}catch(e){} };
function resetPick(){ pick={}; save(); render(); }

function defaults(p){
  const ok = p.images.map((u,i)=>i).filter(i=>!/stiker-pack/i.test(p.images[i]));
  return {hero: ok[0] ?? 0, sup: ok.slice(1,3)};
}
function state(p){ return pick[p.slug] || defaults(p); }

function cover(){
  return `<section class="page cover"><div class="split"></div><div class="mid"></div><div class="grid"></div>
  <div class="hazard" style="left:0;right:0;top:0"></div>
  <div class="lock">TORCH × MOBILE SUIT GUNDAM</div>
  <h1>Pick<span>Your</span>Side</h1>
  <div class="sub">PRODUCT CATALOG · 2026</div>
  <div class="tag">Earth Federation<br>vs Principality of Zeon<small>${DATA.length} PRODUK · FULL COLLECTION</small></div>
  <div class="bar"><span class="brand">TORCH.ID</span>COVER | 01</div></section>`;
}
function toc(){
  const cols = GROUPS.map((g,gi)=>`<div class="col">`+g.map(sec=>{
    const items = DATA.filter(p=>p.section===sec);
    return `<div class="sec">${sec}</div>`+items.map(p=>`<div class="it"><i>${String(p.no).padStart(2,"0")}</i>${esc(p.name)}<em>${p.page}</em></div>`).join("")+`<div class="gap"></div>`;
  }).join("")+(gi===GROUPS.length-1?`<div class="sec">STICKER</div><div class="it"><i>★</i>Sticker Gundam<em>${DATA.length+3}</em></div>`:"")+`</div>`).join("");
  return `<section class="page toc"><div class="grid"></div><h2 data-t="Contents">Contents</h2>
  <div class="dots" style="right:12mm;top:10mm"></div>
  <div class="cols">${cols}</div><div class="bar"><span class="brand">TORCH × GUNDAM</span>CONTENTS | 02</div></section>`;
}
function product(p){
  const st = state(p), acc = ACC[p.faction];
  const hero = p.images[st.hero], sups = st.sup.map(i=>p.images[i]).filter(Boolean);
  const yel = p.faction==="neu";
  const size = p.name.length<=17?15:p.name.length<=24?12.5:10.8;
  const badge = p.faction==="zeon"?"ZEON":p.faction==="fed"?"FEDERATION":"";
  const colors = p.colors.length ? `<div><div class="lbl ${yel?"yel":""}">Pilihan Warna · ${p.colors.length}</div><div class="cols">`+
    p.colors.map(c=>`<div class="col">${c.img?`<img class="ph" src="${IMGW(c.img,200)}">`:`<span class="sw" style="background:${c.bg}"></span>`}<span>${esc(c.name)}</span></div>`).join("")+`</div></div>` : "";
  const sizes = p.sizes.length ? `<div><div class="lbl ${yel?"yel":""}">Ukuran</div><div class="sizes">`+p.sizes.map(s=>`<span class="sz">${esc(s.name)}</span>`).join("")+`</div></div>` : "";
  const pk0 = p.images.filter(u=>/stiker-pack/i.test(u)), pk = (pk0.length?pk0:(DATA.find(x=>x.images.some(u=>/stiker-pack/i.test(u)))||{images:[]}).images.filter(u=>/stiker-pack/i.test(u))).slice().sort();
  const stk = `<div><div class="lbl ${yel?"yel":""}">Free Sticker Gundam</div>${pk.length?`<div class="fs">${pk.map(u=>`<div><img src="${IMGW(u,500)}"></div>`).join("")}</div>`:""}<div class="note" style="margin-top:2.4mm">Dapatkan free ${p.limited?"limited ":""}sticker Gundam selama persediaan masih ada.</div></div>`;
  const single = "";
  return `<section class="page prod" style="--a:${acc}">
    <div class="grid"></div>
    <div class="slab"></div>
    <div class="hero"><img src="${IMGW(hero,1400)}" alt="${esc(p.name)}"></div>
    <div class="num">${String(p.no).padStart(2,"0")}</div>
    ${badge?`<div class="badge">${badge}</div>`:""}
    ${sups.length?`<div class="sup">${sups.map(u=>`<div><img src="${IMGW(u,500)}"></div>`).join("")}</div>`:""}
    <div class="info">
      <div class="type ${yel?"yel":""}">${esc(p.type)}</div>
      <h2 data-t="${esc(p.name)}" style="font-size:${size}mm">${esc(p.name).replace(/(T-Shirt|MS-06|RX-78-2|MSN-02)/g,'<span style="white-space:nowrap">$1</span>')}</h2>
      <div class="price"><b>${rp(p.normal>0?p.normal:p.price)}</b></div>
      ${colors}${sizes}${stk}${single}
      <div class="url">${esc(p.url.replace("https://",""))}</div>
    </div>
    ${p.soldout?`<div class="soldout">SOLD OUT</div>`:""}
    <div class="dots" style="right:12mm;bottom:14mm;width:30mm;height:22mm"></div>
    <div class="bar"><span class="brand">TORCH × GUNDAM</span>${esc(p.section)} | ${String(p.page).padStart(2,"0")}</div>
  </section>`;
}
function picker(p){
  const st = state(p);
  return `<div class="picker" data-slug="${p.slug}"><small>${esc(p.name)} — klik = foto utama · Shift+klik = foto pendukung</small>`+
    p.images.map((u,i)=>`<img loading="lazy" src="${IMGW(u,160)}" data-i="${i}" class="${i===st.hero?"hero":st.sup.includes(i)?"sup":""}">`).join("")+`</div>`;
}
function stickerPage(){
  const pk = (DATA[0].images||[]).filter(u=>/stiker-pack/i.test(u)).sort();
  const names = ["Gundam Sticker","Gundam Mobile Suit Sticker","Char's Zaku II Sticker"];
  return `<section class="page prod" style="--a:#f2b705"><div class="grid"></div><div class="slab"></div>
  <div class="hero" style="background:#0c1630;display:flex;align-items:center;justify-content:center;gap:5mm;padding:14mm 28mm 14mm 10mm">
    ${pk.map(u=>`<div style="flex:1;aspect-ratio:3/4;background:#fff;border:1.2mm solid #fff;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.4)"><img src="${IMGW(u,600)}" style="width:100%;height:100%;object-fit:cover"></div>`).join("")}
  </div>
  <div class="num" style="top:6mm">★</div>
  <div class="info">
    <div class="type yel">Include Sticker</div>
    <h2 data-t="Sticker Gundam" style="font-size:16mm">Sticker<br>Gundam</h2>
    <div><div class="lbl yel">Pilih 1 desain</div><div class="stk">${names.map((n,i)=>`<div><i>0${i+1}</i>${n}</div>`).join("")}</div></div>
    <div class="note">Dapatkan free sticker Gundam selama persediaan masih ada. Ransel limited (Axis &amp; Nexus) mendapat free limited sticker Gundam.</div>
    <div class="url">torch.id/collections/all-gundam</div>
  </div>
  <div class="bar"><span class="brand">TORCH × GUNDAM</span>STICKER | ${DATA.length+3}</div></section>`;
}
function back(){
  return `<section class="page cover"><div class="split" style="transform:scaleX(-1)"></div><div class="grid"></div>
  <div class="hazard" style="left:0;right:0;bottom:11mm"></div>
  <div class="lock" style="top:60mm;left:16mm;font-size:30px;letter-spacing:8px">TORCH.ID</div>
  <h1 style="top:78mm;font-size:30mm">Pilih<span>Fraksi Lu</span></h1>
  <div class="tag" style="bottom:26mm">Torch × Mobile Suit Gundam<small>torch.id/collections/all-gundam</small></div>
  <div class="bar">END | ${DATA.length+4}</div></section>`;
}
function render(){
  DATA.forEach(p=>{ p.page = 0; });
  const ordered = DATA.slice().sort((a,b)=>TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type));
  ordered.forEach((p,i)=>{p.no=i+1;p.page=i+3;});
  DATA.length=0; ordered.forEach(p=>DATA.push(p));
  document.getElementById("wrap").innerHTML = cover()+toc()+DATA.map(p=>product(p)+picker(p)).join("")+stickerPage()+back();
}
document.addEventListener("click",e=>{
  const img = e.target.closest(".picker img"); if(!img) return;
  const slug = img.parentElement.dataset.slug, p = DATA.find(x=>x.slug===slug), i = +img.dataset.i;
  const cur = JSON.parse(JSON.stringify(state(p)));
  if(e.shiftKey || document.getElementById("supMode").checked){ const k = cur.sup.indexOf(i); if(k>=0) cur.sup.splice(k,1); else { cur.sup.push(i); if(cur.sup.length>2) cur.sup.shift(); } }
  else { cur.hero = i; cur.sup = cur.sup.filter(x=>x!==i); }
  pick[slug] = cur; save();
  const y = scrollY; render(); scrollTo(0,y);
});
render();
// Tablet/laptop kecil (901–1122 px): halaman 297mm diperkecil mengikuti lebar layar. Di ≤ 900 px tampilan mobile bawaan
// (satuan vw) yang dipakai, jadi TIDAK boleh di-zoom. Cetak tetap ukuran asli.
(function fit(){
  const w = document.getElementById("wrap"), pw = 297 * 96 / 25.4;
  const apply = ()=>{ w.style.zoom = innerWidth > 900 ? Math.min(1, innerWidth / pw) : 1; };
  apply(); addEventListener("resize", apply);
  addEventListener("beforeprint", ()=>{ w.style.zoom = 1; });
  addEventListener("afterprint", apply);
})();
</script>
</body>
