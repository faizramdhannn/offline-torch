# Membuat ulang PDF Online Catalog & Clearance Catalog tiap hari di GitHub (bukan di Vercel),
# lalu mengunggahnya ke Vercel Blob. Hemat CPU Vercel Hobby. Bisa juga dijalankan manual (tab Actions → Run workflow).
#
# Secrets yang dibutuhkan (Settings → Secrets and variables → Actions):
#   GOOGLE_CREDENTIALS, SPREADSHEET_CATALOG, DATABASE_URL, BLOB_READ_WRITE_TOKEN
name: Refresh katalog PDF

on:
  # GitHub TIDAK menjamin ketepatan jadwal (bisa tertunda dari beberapa menit sampai berjam-jam saat antrean padat),
  # jadi targetnya dimajukan: jadwal utama 08:47 WIB dan jadwal kedua 09:27 WIB. Kalau yang pertama sudah sukses,
  # yang kedua otomatis dilewati (lihat scripts/generate-catalogs.ts). Menit "tidak bulat" sengaja dipilih
  # supaya tidak berebut antrean dengan jadwal-jadwal di menit 00/30.
  # Cron Vercel (03:00 UTC) tetap jadi cadangan terakhir.
  schedule:
    - cron: "47 1 * * *" # 01:47 UTC = 08:47 WIB
    - cron: "27 2 * * *" # 02:27 UTC = 09:27 WIB
  workflow_dispatch:
    inputs:
      catalog:
        description: "Kosongkan untuk semua, atau isi: online / clearance"
        required: false
        default: ""

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Buat & unggah PDF
        run: npx tsx scripts/generate-catalogs.ts ${{ github.event.inputs.catalog }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_CATALOG: ${{ secrets.SPREADSHEET_CATALOG }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
